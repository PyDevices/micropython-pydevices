# h264enc's tests that run without a board, and the module built into a P4
# firmware. The encode test itself (tests/hardware/test_h264enc.py) needs the
# P4's hardware encoder: here, ffmpeg's x264 encodes the same frames at the
# same settings, and check_h264_ffmpeg.py decodes and scores them as it does
# the board's stream, its planted fault included.
name: h264enc

on:
  push:
    branches: [main]
    paths:
      - 'modules/h264enc/**'
      - 'build_mp.py'
      - '.github/workflows/h264enc.yml'
  pull_request:
    paths:
      - 'modules/h264enc/**'
      - 'build_mp.py'
      - '.github/workflows/h264enc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg and numpy
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install numpy

      - name: Encode the test's frames with x264
        working-directory: modules/h264enc/tests
        run: python3 encode_h264_ffmpeg.py "$RUNNER_TEMP/h264enc.h264"

      - name: The PC half decodes and scores them (and its planted fault fails)
        working-directory: modules/h264enc/tests
        run: python3 check_h264_ffmpeg.py "$RUNNER_TEMP/h264enc.h264"

  esp32p4:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_ASM_COMPILER_LAUNCHER: ccache
      IDF_CCACHE_ENABLE: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Packages the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext cmake ninja-build pkg-config libffi-dev

      - name: The runner's Python, which the cached venvs are tied to
        id: py
        run: echo "version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

      # release-firmware.yml's cache, the same paths and key so it's shared:
      # ESP-IDF and the compilers it downloads (the CircuitPython paths stay empty)
      - name: Cache ESP-IDF
        uses: actions/cache@v6
        with:
          path: |
            deps/esp-idf
            deps/circuitpython
            deps/circuitpython-venv
            ~/.espressif
          key: deps-idf-py${{ steps.py.outputs.version }}-${{ hashFiles('deps.lock', 'patches/circuitpython/**') }}

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ccache-h264enc-p4-${{ hashFiles('UPSTREAM', 'modules.lock') }}-${{ github.run_id }}
          restore-keys: |
            ccache-h264enc-p4-${{ hashFiles('UPSTREAM', 'modules.lock') }}-
            ccache-h264enc-p4-

      - name: Build an ESP32-P4 firmware with h264enc
        run: python3 build_mp.py --port esp32 --board ESP32_GENERIC_P4 --variant WIFI6_DEV_KIT_H2 --flash 16MB --modules h264enc,ppa

      - name: h264enc is linked in
        run: |
          map=builds/esp32/ESP32_GENERIC_P4/WIFI6_DEV_KIT_H2/micropython.map
          grep -q 'h264enc_open' "$map"
          grep -q 'h264enc_user_cmodule' "$map"
          ccache -s | head -12
