# Scheduled compatibility check: the patch series must apply cleanly to the
# pinned upstream, so drift is known before a pin move is ever attempted.
name: Overlay compatibility

# Documentation-only changes can't change this result, so they don't run it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: overlay
      # Read the ref from UPSTREAM rather than repeating it here. The two drifted
      # during the move to v1.29.0 -- the series was rebased, this ref was not --
      # and the whole check quietly became "does the new series apply to the old
      # tree?", which it does not and should not.
      - name: Read the pinned upstream from UPSTREAM
        id: pin
        run: echo "ref=$(cat overlay/UPSTREAM)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned upstream
        uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: ${{ steps.pin.outputs.ref }}
          path: micropython
          fetch-depth: 1
      # No modules are present here, so this checks the overlay alone; the
      # modules' own patches are checked where they live.
      - name: The series applies clean to the pin
        run: python3 overlay/patches/apply_patches.py micropython --check
