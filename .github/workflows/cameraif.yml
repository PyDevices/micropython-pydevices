# cameraif: flake8 over its examples (defect checks only, configured in modules/cameraif/.flake8). Its C is MIPI-CSI hardware, proven on the P4. (These checks moved here with cameraif from its own repository, 2026-10-19.)
name: cameraif

on:
  push:
    branches: [main]
    paths:
      - 'modules/cameraif/**'
      - 'build_mp.py'
      - 'modules.lock'
      - 'patches/**'
      - '.github/workflows/cameraif.yml'
  pull_request:
    paths:
      - 'modules/cameraif/**'
      - 'build_mp.py'
      - 'modules.lock'
      - 'patches/**'
      - '.github/workflows/cameraif.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/cameraif
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install flake8
      - run: python -m flake8
