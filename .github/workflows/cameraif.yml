# cameraif: flake8 over its examples (defect checks only, configured in modules/cameraif/.flake8). Its C is MIPI-CSI hardware, proven on the P4. (These checks moved here with cameraif from its own repository, 2026-10-19.)
name: cameraif

on:
  push:
    branches: [main]
    paths:
      - 'modules/cameraif/**'
      - '!modules/cameraif/*.md'
      - '!modules/cameraif/docs/**'
      - 'build_mp.py'
      - 'modules.lock'
      - 'patches/**'
      - '.github/workflows/cameraif.yml'
  pull_request:
    paths:
      - 'modules/cameraif/**'
      - '!modules/cameraif/*.md'
      - '!modules/cameraif/docs/**'
      - 'build_mp.py'
      - 'modules.lock'
      - 'patches/**'
      - '.github/workflows/cameraif.yml'
  # Everything, weekly: the path filters skip what a change can't reach.
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. A push to main is
# never cancelled: each one keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake8:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/cameraif
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install flake8
      - run: python -m flake8
