# The firmware set: MicroPython and CircuitPython-compatible images for the
# boards we have run, each built by build_mp.py from this checkout's pins, then
# checked and described in one firmware.json. Cells are in
# scripts/release_firmware.py.
#
# This workflow publishes nothing. It builds every cell, checks the files and
# keeps them as a run artifact (14 days). Run it by hand under Actions >
# Release firmware > Run workflow, or let it run every Monday: that run keeps
# the caches warm and says the week an upstream pin moves and a board stops
# building. Changes to the recipe run the same builds on their pull request.
#
# One input goes further: "draft_release" attests every file and puts them on a
# DRAFT GitHub Release, which only people who can push to the repository can
# see. Nothing here publishes it, makes a public tag, or touches a site: a
# draft creates no tag until someone presses Publish, and a set built from
# preview pins only takes a tag that starts "staged-" (release_firmware.py
# notes). Only the draft job can write, and only on a manual run.
#
# Toolchains and compiler output are cached, but a release is rare, so a cold
# build is the case to plan for: the cache is a bonus, dropped after 7 days
# unused.
name: Release firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Name for the set's files and its draft (empty makes v<MicroPython version>-<date>; a draft built from preview pins needs staged-<name>)
        default: ""
        type: string
      draft_release:
        description: Attest the files and put them on a draft GitHub Release (manual runs only; never published)
        default: false
        type: boolean
      pico2:
        description: Build the Raspberry Pi Pico 2 and the Pimoroni Pico Plus 2 W too (off until a board is on the bench)
        default: false
        type: boolean
      lvgl-circuitpython-ref:
        description: lvgl-circuitpython branch, tag or commit for the CircuitPython builds (left empty, it takes the commit modules.lock pins)
        default: ''
        type: string
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - '.github/workflows/release-firmware.yml'
      - 'scripts/release_firmware.py'
      - 'scripts/stage_firmware_page.py'
      - 'test_release_firmware.py'
      - 'test_stage_firmware_page.py'

permissions:
  contents: read

concurrency:
  group: release-firmware-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash with -eo pipefail, so a failing build is not hidden by the tee after it.
defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: The checks themselves pass
        run: python3 -m unittest test_release_firmware test_stage_firmware_page -v
      - name: Which cells this run builds
        id: matrix
        env:
          PICO2: ${{ inputs.pico2 && '--pico2' || '' }}
        run: |
          echo "matrix=$(python3 scripts/release_firmware.py matrix $PICO2)" | tee -a "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.id }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    env:
      # Compiler output, keyed by the compiler's content (a fresh toolchain
      # install has fresh timestamps). CMake and ESP-IDF both read these.
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_ASM_COMPILER_LAUNCHER: ccache
      IDF_CCACHE_ENABLE: '1'
    steps:
      - uses: actions/checkout@v7

      - name: lvgl-circuitpython, which the CircuitPython builds compile in
        if: matrix.interpreter == 'circuitpython'
        env:
          LVGL_CP_REF: ${{ inputs.lvgl-circuitpython-ref }}
        run: |
          # empty input: the commit modules.lock pins
          LVGL_CP_REF="${LVGL_CP_REF:-$(awk '$1=="lvgl-circuitpython"{print $3}' "$GITHUB_WORKSPACE/modules.lock")}"
          mkdir -p "$RUNNER_TEMP/ws" && cd "$RUNNER_TEMP/ws"
          git clone --quiet --depth 1 --branch "$LVGL_CP_REF" https://github.com/PyDevices/lvgl-circuitpython.git \
            || { git clone --quiet https://github.com/PyDevices/lvgl-circuitpython.git \
                 && git -C lvgl-circuitpython checkout --quiet "$LVGL_CP_REF"; }
          git -C lvgl-circuitpython rev-parse HEAD | tee "$RUNNER_TEMP/lvgl-circuitpython.commit"

      - name: Packages the builds need
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext cmake ninja-build pkg-config libffi-dev
          df -h / | tail -1

      # CircuitPython refuses anything older than GCC 14, and Ubuntu's is 13.
      - name: Arm GNU toolchain 14.2
        if: matrix.kind == 'rp2'
        run: |
          name=arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/arm.tar.xz" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$name.tar.xz"
          echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $RUNNER_TEMP/arm.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/arm && sudo tar -xf "$RUNNER_TEMP/arm.tar.xz" -C /opt/arm
          echo "/opt/arm/$name/bin" >> "$GITHUB_PATH"

      - name: The runner's Python, which the cached venvs are tied to
        id: py
        if: matrix.deps != 'none'
        run: echo "version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

      # ESP-IDF v5.5.4 (MicroPython) or CircuitPython's tree with its own
      # ESP-IDF (CircuitPython), and the compilers they download.
      - name: Cache the toolchains
        id: deps
        if: matrix.deps != 'none'
        uses: actions/cache@v6
        with:
          path: |
            deps/esp-idf
            deps/circuitpython
            deps/circuitpython-venv
            ~/.espressif
          key: deps-${{ matrix.deps }}-py${{ steps.py.outputs.version }}-${{ hashFiles('deps.lock', 'patches/circuitpython/**') }}

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ matrix.id }}-${{ hashFiles('UPSTREAM', 'modules.lock') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.id }}-${{ hashFiles('UPSTREAM', 'modules.lock') }}-
            ccache-${{ matrix.id }}-

      - name: Build ${{ matrix.id }}
        run: |
          start=$(date +%s)
          ws=()
          [[ "${{ matrix.interpreter }}" == circuitpython ]] && ws=(--ws "$RUNNER_TEMP/ws")
          python3 scripts/release_firmware.py build "${{ matrix.id }}" out "${ws[@]}"
          {
            echo "### ${{ matrix.id }}"
            echo "- toolchain cache: ${{ steps.deps.outputs.cache-hit == 'true' && 'hit' || (matrix.deps == 'none' && 'none needed' || 'miss') }}"
            echo "- whole step: $(( $(date +%s) - start )) s"
            echo '```'
            ccache -s | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh deps ~/.espressif "$CCACHE_DIR" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: cell-${{ matrix.id }}
          path: out
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only on purpose: nothing here attaches to a release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cell-*
          merge-multiple: true
          path: in

      - name: lvgl-circuitpython's commit
        id: lvgl
        env:
          LVGL_CP_REF: ${{ inputs.lvgl-circuitpython-ref }}
        run: |
          # empty input: the commit modules.lock pins
          LVGL_CP_REF="${LVGL_CP_REF:-$(awk '$1=="lvgl-circuitpython"{print $3}' "$GITHUB_WORKSPACE/modules.lock")}"
          git clone --quiet --depth 1 --branch "$LVGL_CP_REF" https://github.com/PyDevices/lvgl-circuitpython.git lvgl-cp \
            || { git clone --quiet https://github.com/PyDevices/lvgl-circuitpython.git lvgl-cp \
                 && git -C lvgl-cp checkout --quiet "$LVGL_CP_REF"; }
          echo "commit=$(git -C lvgl-cp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the files and write firmware.json
        env:
          PICO2: ${{ inputs.pico2 && '--pico2' || '' }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_firmware.py assemble in firmware $PICO2 \
            --tag "$TAG" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --lvgl-circuitpython-commit "${{ steps.lvgl.outputs.commit }}"
          ls -l firmware
          cat firmware/firmware.json

      - name: esptool reads every ESP image
        run: |
          python3 -m venv "$RUNNER_TEMP/esptool-venv"
          "$RUNNER_TEMP/esptool-venv/bin/pip" install -q "esptool>=5"
          esptool="$RUNNER_TEMP/esptool-venv/bin/esptool"
          "$esptool" version
          python3 - "$esptool" <<'PY'
          import json, subprocess, sys
          esptool = sys.argv[1]
          doc = json.load(open("firmware/firmware.json"))
          bad = 0
          bootloader = {"esp32s3": 0, "esp32p4": 0x2000}
          for b in doc["builds"]:
              if b["chip"] not in ("esp32p4", "esp32s3"):
                  continue
              for f in b["files"]:
                  if f["role"] not in ("flash", "app"):
                      continue
                  # A flash image padded from 0 starts with blank flash, not an image.
                  if f["role"] == "flash" and int(b["flash_offset"], 16) != bootloader[b["chip"]]:
                      continue
                  r = subprocess.run([esptool, "--chip", b["chip"], "image-info", "firmware/" + f["name"]],
                                     capture_output=True, text=True)
                  ok = r.returncode == 0 and "Checksum" in r.stdout and "invalid" not in r.stdout.lower()
                  print(("ok   " if ok else "FAIL ") + f["name"])
                  if not ok:
                      bad += 1
                      print(r.stdout[-1500:], r.stderr[-1500:])
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware
          if-no-files-found: error
          retention-days: 14

  # A draft Release and nothing else. It reads the checked set that `assemble`
  # kept, attests every file, and creates the draft. `--draft` never creates
  # the tag (GitHub makes it when a draft is published), which the last step
  # checks. If the tag or a release of that name already exists, it stops.
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    needs: [assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware

      - name: The tag may go on a draft, and the Release's notes
        run: |
          python3 scripts/release_firmware.py notes firmware/firmware.json --out "$RUNNER_TEMP/notes.md"
          echo "TAG=$(python3 -c 'import json; print(json.load(open("firmware/firmware.json"))["tag"])')" >> "$GITHUB_ENV"
          echo "PRERELEASE=$(python3 -c 'import json; print("--prerelease" if json.load(open("firmware/firmware.json"))["preview"] else "")')" >> "$GITHUB_ENV"

      - name: Nothing of that name exists yet
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release named $TAG already exists"; exit 1
          fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: firmware/*

      - name: Create the draft Release
        run: |
          gh release create "$TAG" firmware/* --draft $PRERELEASE --target "$GITHUB_SHA" \
            --title "OmniPython firmware $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json isDraft,url,assets --jq '"draft=\(.isDraft) \(.url) assets=\(.assets|length)"'

      - name: It is still a draft and no tag was made
        run: |
          [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG exists after a draft"; exit 1
          fi
