# btaudio from a bare clone: a classic ESP32 firmware with the module, built
# as a release would (ESP-IDF at deps.lock's pin, under the esp32 port's
# -Werror=all), and the ESP-IDF component alone on ESP-IDF 6.1 for every chip
# it is written for, the ESP32-S31 among them, which MicroPython can't build
# for yet.
name: btaudio

on:
  push:
    branches: [main]
    paths:
      - 'modules/btaudio/**'
      - '!modules/btaudio/*.md'
      - '!modules/btaudio/examples/**'
      - 'build_mp.py'
      - '.github/workflows/btaudio.yml'
  pull_request:
    paths:
      - 'modules/btaudio/**'
      - '!modules/btaudio/*.md'
      - '!modules/btaudio/examples/**'
      - 'build_mp.py'
      - '.github/workflows/btaudio.yml'
  # Everything, weekly: the path filters skip what a change can't reach.
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. A push to main is
# never cancelled: each one keeps its own record.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_ASM_COMPILER_LAUNCHER: ccache
      IDF_CCACHE_ENABLE: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Packages the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gettext cmake ninja-build pkg-config libffi-dev

      - name: The runner's Python, which the cached venvs are tied to
        id: py
        run: echo "version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

      # release-firmware.yml's cache, the same paths and key so it's shared.
      - name: Cache ESP-IDF
        uses: actions/cache@v6
        with:
          path: |
            deps/esp-idf
            deps/circuitpython
            deps/circuitpython-venv
            ~/.espressif
          key: deps-idf-py${{ steps.py.outputs.version }}-${{ hashFiles('deps.lock', 'patches/circuitpython/**') }}

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: /home/runner/.cache/ccache
          key: ccache-btaudio-esp32-${{ hashFiles('UPSTREAM', 'modules.lock') }}-${{ github.run_id }}
          restore-keys: |
            ccache-btaudio-esp32-${{ hashFiles('UPSTREAM', 'modules.lock') }}-
            ccache-btaudio-esp32-

      - name: Build a classic ESP32 firmware with btaudio
        run: python3 build_mp.py --port esp32 --board ESP32_GENERIC --variant SPIRAM --modules btaudio

      - name: btaudio is linked in, and Bluedroid's A2DP sink with it
        run: |
          map=builds/esp32/ESP32_GENERIC/SPIRAM/micropython.map
          grep -q 'btaudio_start' "$map"
          grep -q 'btaudio_module' "$map"
          grep -q 'esp_a2d_sink_init' "$map"

  idf61:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s31]
    steps:
      - uses: actions/checkout@v7

      - name: The component alone, for ${{ matrix.target }} on ESP-IDF 6.1
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd modules/btaudio/tests/idf_app
          idf.py -B "build-${{ matrix.target }}" set-target ${{ matrix.target }} build
