# esp_new_jpeg provides esp_jpeg_dec.h/esp_jpeg_enc.h for esp-vision's
# platform/jpeg.c; esp-dl serves espdl; esp_media_protocols and
# media_lib_sal serve rtsp. Versions are esp-vision's, except esp_h264:
# h264enc's 1.4.1 (esp-vision uses 1.3.0), since one firmware takes one version.
dependencies:
  espressif/esp_new_jpeg:
    version: "1.0.2"
    require: public
    rules:
      - if: "target in [esp32p4, esp32s3]"
  espressif/esp_h264:
    version: "1.4.1"
    require: public
    rules:
      - if: "target == esp32p4"
  espressif/esp-dl:
    version: "3.3.6"
    require: public
    rules:
      - if: "target in [esp32p4, esp32s3]"
  espressif/esp_media_protocols:
    version: "0.6.2"
    require: public
    rules:
      - if: "target == esp32p4"
  espressif/media_lib_sal:
    version: "1.0.2"
    require: public
    rules:
      - if: "target == esp32p4"
