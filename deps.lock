# Toolchain pins: name, URL, version. A build fetches and checks only the one
# its port uses: esp-idf for esp32, emsdk for webassembly, SDL2 for windows
# when displayif is selected, circuitpython for --interpreter circuitpython,
# and the ESP-IDF components below for a CircuitPython espressif build with
# cameraif.
# In a workspace deps/<name> may be a symlink to a shared checkout, and a
# build refuses if it isn't the version below.
# The ESP-IDF version is our choice, not upstream's recommendation.
esp-idf   https://github.com/espressif/esp-idf.git                                                           v5.5.4
emsdk     https://github.com/emscripten-core/emsdk.git                                                       6.0.1
SDL2      https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz  2.30.10
# TinyUSB for the esp32 port's S2, S3 and P4 builds, at the tag patch 0014
# points the port's component manifest at. build_mp.py checks the two agree,
# applies patches/tinyusb/ to this copy and builds it in place of the managed
# component. The name is the component's: ESP-IDF names one by its directory.
espressif__tinyusb https://github.com/micropython/tinyusb-espressif.git                                     v0.21.0.1-micropython1
# CircuitPython is the second interpreter, and the one pin that is a source
# tree rather than a toolchain. Always our own checkout in deps/, never a link
# to a sibling. 11.0.0-alpha.1 is commit 520805e12, the first release of the
# 11.0 line, whose core is MicroPython 1.29, like UPSTREAM.
circuitpython https://github.com/adafruit/circuitpython.git                                                  11.0.0-alpha.1
# ESP-IDF components for cameraif on CircuitPython's espressif port: the camera
# sensor drivers and the two components they need, from Espressif's component
# registry, at the versions MicroPython's P4 build resolves. CircuitPython
# builds with the component manager off, so these are fetched into deps/ when
# an espressif build names cameraif.
esp_cam_sensor  https://components-file.espressif.com/components/espressif/esp_cam_sensor/2.6.0/espressif__esp_cam_sensor-v2.6.0.zip    2.6.0
esp_sccb_intf   https://components-file.espressif.com/components/espressif/esp_sccb_intf/0.0.9/espressif__esp_sccb_intf-v0.0.9.zip      0.0.9
cmake_utilities https://components-file.espressif.com/components/espressif/cmake_utilities/0.5.3/espressif__cmake_utilities-v0.5.3.zip  0.5.3
