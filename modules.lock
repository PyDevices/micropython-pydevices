# Module pins: name, git URL, commit. build_mp.py clones a module at its commit
# only when modules/<name> is missing; in the workspace modules/<name> is a
# symlink to the sibling checkout and wins. castif is not here: it lives in
# modules/castif, tracked in this repository. Commits are full SHAs: GitHub
# serves a fetch by commit only for the whole 40 characters.
#
# omnipython-lib is not a module either: it is the repository of our Python-only
# packages (pydevices, palettes, pdwidgets, appkit, audioinstruments,
# audioeffects, board configs and drivers). A build asks its
# tools/libbuild.py for the library tree and require()s packages from it; the
# modules/ entries of those names are manifests that do exactly that. It is
# the pydevices repository until the rename. The packages the library builds
# from other repositories (audiocomponents' two) are pinned by tag in its
# lib-lock.json, not here.
#
# lvgl-bindings is not a module but the source lvgl-micropython compiles: a
# build that has lvgl-micropython fetches it at this commit into
# modules/.lvgl-bindings (a sibling checkout is linked there instead) and
# hands it to lvgl-micropython, whose own LVGL_BINDINGS_COMMIT then goes unused.
